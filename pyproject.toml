[project]
name = "redteam-foundry"
version = "0.5.1"
description = "An adversarial benchmark foundry for LLM safety: audit attack corpora, score benchmark staleness, compare defences (ASR + false-refusal), test multilingual over-refusal, and export safe challenge packs."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
keywords = [
  "llm",
  "ai-safety",
  "red-team",
  "evaluation",
  "prompt-injection",
  "jailbreak",
  "benchmark",
  "benchmark-staleness",
  "false-refusal",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # LLM clients
  "anthropic>=0.40",
  "openai>=1.50",          # for OpenAI Moderation API later; cheap to install now
  "ollama>=0.4",
  # core
  "pydantic>=2.13,<3",
  "httpx>=0.27",
  "tenacity>=9.0",
  # data
  "datasets>=3.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  # CLI / output
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dashboard = [
  # A results dashboard is roadmap, not built yet — these are heavy, so they
  # are opt-in rather than in the default install.
  "streamlit>=1.40",
  "plotly>=5.24",
]
agentdojo = [
  # Enables the real AgentDojo loader (src/redteam/corpora/agentdojo.py).
  # AGPL-3.0; we use it as a runtime dependency only — no redistribution.
  "agentdojo>=0.1",
]
inspect = [
  # Enables `redteam export-inspect` — RunResult -> Inspect AI eval log, so
  # runs can be opened in `inspect view` or loaded with read_eval_log().
  "inspect-ai>=0.3.224",
]
provenance = [
  # Enables src/redteam/provenance.py — Simplified/Traditional locale
  # renderings and their divergence metrics. Apache-2.0.
  #
  # The dictionary CONTENT is the treatment, not the version string: exact
  # per-file SHA-256 and entry counts are pinned in src/redteam/opencc_pin.py
  # and verified by tests/unit/test_opencc_pin.py. Upgrading this range without
  # updating that pin will change conversion results silently.
  "OpenCC>=1.1",
]
guard = [
  # Running a local guard classifier (scripts/run_locale_provenance_guard.py).
  #
  # transformers is capped BELOW 5 on purpose. DO NOT RAISE THIS BOUND without
  # re-testing: transformers 5.14.1's weight-placement path segfaults (SIGSEGV,
  # exit 139) at roughly 60% of weight loading for an 8B Llama checkpoint under
  # EVERY device_map — "auto", explicit {"": 0}, quantised and unquantised
  # alike. It is not a capacity problem (4-bit needs ~5.5GB against 6.6GB free)
  # and not a driver problem (a bare bf16 GPU matmul passes). transformers
  # 4.57.6 loads and generates from the same checkpoint on the same GPU in
  # under two seconds.
  #
  # SECOND DOOR, so nobody wastes a day finding it: device_map="auto" is NOT
  # the workaround. The CPU-offload dispatch segfaults on 4.57.6 as well, so it
  # is unstable here independently of the transformers version. Use explicit
  # single-device placement ({"": 0}, i.e. --device 0) and a model that fits in
  # VRAM. An 8B checkpoint fits at 4-bit and does not fit at bf16.
  "transformers>=4.50,<5",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "sentencepiece",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.3",
  "pytest-cov>=5.0",
  "ruff>=0.15,<0.16",  # pin minor — keep in sync with .pre-commit-config.yaml
  "mypy>=1.13",
  "pre-commit>=4.0",
  # exercised by tests/unit/test_inspect_export.py (CI runs the exporter test)
  "inspect-ai>=0.3.224",
  # scripts/plot_results.py — regenerates the README results figure
  "matplotlib>=3.8",
  # exercised by tests/unit/test_provenance.py. In `dev` as well as its own
  # extra so the suite never silently shrinks when the extra is absent.
  "OpenCC>=1.1",
  # tests/unit/test_sdist_contents.py builds the sdist IN PROCESS and reads its
  # member list. The build backend is normally installed into an isolated
  # environment the test cannot import from, so it is named here as well —
  # otherwise the one check that opens the artifact would silently not run.
  "hatchling>=1.25",
  # types
  "types-PyYAML",
]

[project.scripts]
redteam = "redteam.cli:app"

[project.urls]
Homepage = "https://github.com/rosscyking1115/redteam-foundry"
Repository = "https://github.com/rosscyking1115/redteam-foundry"
Documentation = "https://github.com/rosscyking1115/redteam-foundry/blob/main/METHODOLOGY.md"
Changelog = "https://github.com/rosscyking1115/redteam-foundry/blob/main/CHANGELOG.md"
Issues = "https://github.com/rosscyking1115/redteam-foundry/issues"

# ----------------------------------------------------------------------------
# Build
# ----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]

# The sdist contents are an ALLOWLIST, and the difference from an exclude list is
# the entire point.
#
# An allowlist FAILS CLOSED: anything not named here is absent from the sdist,
# including a directory that does not exist yet. An exclude list FAILS OPEN:
# anything not named is included, so the next tool that drops a cache directory
# into the working tree publishes it, silently, on the next release.
#
# Until now this project declared no sdist selection at all, which is an exclude
# list — hatchling packaged the whole working tree minus the *repository's*
# .gitignore. That backend never reads a contributor's global gitignore
# (`core.excludesFile`), so anything hidden there is invisible to `git status`,
# invisible in review, invisible in CI, and packaged anyway. PyPI uploads cannot
# be unpublished.
#
# That is not hypothetical here. Built against the old configuration, the sdist
# contained `data/.gitkeep` and `results/.gitkeep` — two files git does not
# track, ignored by this repository's own `/data/` and `/results/` rules.
# Hatchling honoured the `!` re-inclusion that git cannot, so the backend's file
# selection provably was not the repository's. Both files are empty, so nothing
# escaped; the mechanism is the finding, not the payload. `data/` and `results/`
# hold a download cache and full run outputs respectively.
#
# tests/unit/test_sdist_contents.py builds the sdist and fails if any member is
# untracked, so this list cannot admit a local-only path without CI going red.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/configs",
  "/examples",
  "/reports",
  "/challenge_packs",
  "/.github",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/METHODOLOGY.md",
  "/ETHICS.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  # `/uv.lock` was here. The lockfile is no longer tracked (see METHODOLOGY.md
  # section 10) and an allowlist entry naming an untracked path is exactly what
  # tests/unit/test_sdist_contents.py refuses — it either packages something git
  # does not track, or it is stale. That test is what caught this one.
  "/.env.example",
  "/.gitattributes",
  "/.gitignore",
  "/.pre-commit-config.yaml",
]

# ----------------------------------------------------------------------------
# Ruff (lint + format)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle / pyflakes
  "I",               # isort
  "B",               # bugbear
  "UP",              # pyupgrade
  "SIM",             # simplify
  "RUF",             # ruff-specific
]
ignore = [
  "E501",            # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# The multilingual benign corpus and its test intentionally contain CJK text.
# RUF001 flags "ambiguous" Unicode (homoglyph) characters — a false positive
# for legitimate non-Latin data (e.g. full-width CJK punctuation).
"src/redteam/multilingual.py" = ["RUF001"]
"tests/unit/test_multilingual.py" = ["RUF001"]
# Locale-provenance work is entirely about CJK characters that differ by one
# glyph, so RUF001/2/3 (ambiguous unicode in code / docstrings / comments) fire
# on the data itself. RUF003 covers the comparison tables in comments.
"src/redteam/provenance.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_provenance.py" = ["RUF001", "RUF002", "RUF003"]
# The exclusion filter carries CJK blocklist patterns and CJK test fixtures.
"src/redteam/corpora/_filters.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_exclusion_filter.py" = ["RUF001", "RUF002", "RUF003"]
# The alphabet screen and the refusal scorer's tests are *about* non-Latin
# input, so their fixtures are non-Latin by construction. Note the shape of
# this list: every entry is a place where the repository handles text outside
# the Latin alphabet, which is a rough map of where the screen is needed.
"tests/unit/test_readability.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_scorer_refusal.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_taxonomy.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_corpus_quality.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------
# Documentation convention
# ----------------------------------------------------------------------------
# Docstring style: PEP 257 summary line, then prose. NumPy-style section
# headers are used only where a module genuinely has sections to name; short
# functions take a single summary line and nothing more.
#
# The split that matters here, applied consistently across these repositories:
#   - a DOCSTRING says what a thing does and how to use it;
#   - a COMMENT says why the code is the way it is — a constraint, a rejected
#     alternative, a bug being worked around.
# A comment restating what the next line does is noise; a docstring explaining
# project history belongs in docs/.
#
# Priority when retrofitting: module docstrings first (they orient a reader
# who has never seen the file), then the public surface. Private helpers are
# documented only where the reason is non-obvious. Coverage is not the goal.
[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ----------------------------------------------------------------------------
# Mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party libs without bundled type stubs.
module = ["ollama.*", "datasets.*", "plotly.*", "agentdojo.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"          # auto, not strict
markers = [
  "smoke: end-to-end smoke tests (may take longer)",
  "live: tests that hit live APIs (skipped in CI; require RUN_LIVE=1)",
]
